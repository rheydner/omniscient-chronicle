name: Supabase Keep-Alive (Omniscient Chronicle)

on:
  schedule:
    # Executa a cada 3 dias as 12:00 UTC para manter o bucket vtt-assets ativo no Supabase Free Tier
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Storage & Health
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive requests to Supabase
        run: |
          echo "Disparando ping de atividade do Omniscient Chronicle para o Supabase..."
          SUPABASE_URL="https://eftyemsvgbibnyqzxxon.supabase.co"
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY="sb_publishable_H1s0C5a3lxbZvSMxLvscLg_kptHG7Ca"
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/storage/v1/bucket" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Storage Bucket Ping status: $HTTP_STATUS"

          OBJECTS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/list/vtt-assets" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"limit": 1}')
          echo "Storage Objects Ping status: $OBJECTS_STATUS"

          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $ANON_KEY")
          echo "Auth Health Ping status: $AUTH_STATUS"
